[package]
name = "win32ui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Idiomatic, mostly-safe Rust wrapper over Win32 windows and common controls"
repository = "https://github.com/va1erian/win32ui"
readme = "README.md"

[dependencies]
thiserror = "2"

[target.'cfg(windows)'.dependencies]
# Deliberately narrow: one feature group per Win32 namespace actually used, so
# the generated bindings (and the resulting binary) stay as small as possible.
windows = { version = "0.62", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Only the demo writes a PNG; the library itself stays dependency-free.
png = "0.17"

[build-dependencies]
embed-resource = "3.0"
